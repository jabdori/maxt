[package]
name = "maxt-python"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Native extension for the maxt Python package."
repository = "https://github.com/jabdori/maxt"
homepage = "https://github.com/jabdori/maxt"
readme = "README.md"
publish = false

[features]
default = ["extension-module"]
extension-module = ["pyo3/abi3-py39", "pyo3/extension-module"]

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-core = "0.3"
maxt = { version = "=0.3.2", path = "../.." }
maxt-bindings-common = { version = "=0.3.2", path = "../common" }
pyo3 = { version = "0.29", features = ["multiple-pymethods"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
