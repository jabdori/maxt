version: 0.1.0
repository: https://github.com/jabdori/maxt
homepage: https://github.com/jabdori/maxt
documentation: https://github.com/jabdori/maxt/tree/main/bindings/dart
issue_tracker: https://github.com/jabdori/maxt/issues
