name: maxt
description: Dart and Flutter client for Upbit, Bithumb, Binance, and Hyperliquid through one native and Web API.
version: 0.3.2
repository: https://github.com/jabdori/maxt
homepage: https://github.com/jabdori/maxt
documentation: https://github.com/jabdori/maxt/tree/main/bindings/dart
issue_tracker: https://github.com/jabdori/maxt/issues
topics:
  - cryptocurrency
  - exchange
  - trading
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.10.0

dependencies:
  ffi: ^2.2.0
  flutter_rust_bridge: ">=2.12.0 <2.13.0"
  freezed_annotation: ^3.1.0
  hooks: ^2.0.2
  native_toolchain_rust: ^1.0.4+0

dev_dependencies:
  build_runner: ^2.15.1
  freezed: ^3.2.5
  lints: ^6.0.0
  test: ^1.26.3
