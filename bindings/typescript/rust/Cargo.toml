[package]
name = "maxt-typescript"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "maxt_typescript"
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
maxt = { version = "=0.1.0", path = "../../.." }
maxt-bindings-common = { version = "=0.1.0", path = "../../common" }
napi = { version = "=3.12.0", default-features = false, features = ["napi8", "async", "serde-json"] }
napi-derive = "=3.6.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[build-dependencies]
napi-build = "=2.4.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
