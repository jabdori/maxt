name: Publish Python

on:
  push:
    tags: ["python-v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#python-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' bindings/python/Cargo.toml | head -1)" = "$version"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' bindings/python/pyproject.toml | head -1)" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --manifest-path bindings/codegen/Cargo.toml --no-default-features --features python --locked -- python --check

  wheel:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: "2014"
            platform: manylinux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
            platform: manylinux-aarch64
          - runner: windows-latest
            target: x64
            manylinux: "off"
            platform: windows-x86_64
          - runner: macos-15-intel
            target: x86_64
            manylinux: "off"
            platform: macos-x86_64
          - runner: macos-latest
            target: aarch64
            manylinux: "off"
            platform: macos-aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - uses: PyO3/maturin-action@d60b6a6c53f50a2e78cafc7f8ccb44ed78932dbb
        with:
          working-directory: bindings/python
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist
      - shell: bash
        run: |
          python -m pip install --force-reinstall bindings/python/dist/*.whl
          python -c "import maxt._native"
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.platform }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  sdist:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@d60b6a6c53f50a2e78cafc7f8ccb44ed78932dbb
        with:
          command: sdist
          working-directory: bindings/python
          maturin-version: v1.14.1
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [validate, wheel, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - run: |
          test "$(find dist -name '*.whl' | wc -l)" -eq 5
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 1
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist
          skip-existing: true
