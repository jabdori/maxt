name: Dart CI

on:
  push:
    branches: [main]
    paths:
      - bindings/dart/**
      - bindings/codegen/src/main.rs
      - bindings/codegen/src/dart.rs
      - .github/workflows/ci-dart.yml
  pull_request:
    paths:
      - bindings/dart/**
      - bindings/codegen/src/main.rs
      - bindings/codegen/src/dart.rs
      - .github/workflows/ci-dart.yml

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      flutter-packaging: ${{ steps.filter.outputs.flutter-packaging }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "flutter-packaging=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$base"
          if git diff --name-only "$base" "$GITHUB_SHA" | grep -Eq '^bindings/dart/(hook/|rust/|pubspec\.yaml$|lib/src/(runtime(_io|_web)?|rust/))'; then
            echo "flutter-packaging=true" >> "$GITHUB_OUTPUT"
          else
            echo "flutter-packaging=false" >> "$GITHUB_OUTPUT"
          fi

  dart:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/dart
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            bindings/codegen -> target
            bindings/dart/rust -> target
          cache-bin: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/cache@v5
        with:
          path: bindings/dart/.dart_tool/hooks_runner
          key: ${{ runner.os }}-dart-hooks-${{ hashFiles('bindings/dart/pubspec.lock', 'bindings/dart/pubspec.yaml', 'bindings/dart/rust/Cargo.lock') }}
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/flutter_rust_bridge_codegen
          key: ${{ runner.os }}-frb-codegen-2.12.0
      - run: cargo run --manifest-path ../codegen/Cargo.toml --no-default-features --features dart --locked -- dart --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --all-targets --locked
      - run: dart pub get
      - run: command -v flutter_rust_bridge_codegen >/dev/null || cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
      - run: |
          flutter_rust_bridge_codegen generate
          find lib/src/rust -name '*.freezed.dart' -exec perl -pi -e 's/[ \t]+$//' {} +
          perl -pi -e 's/[ \t]+$//' rust/src/frb_generated.rs
          cargo fmt --manifest-path rust/Cargo.toml
          git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-warnings
      - run: dart test --chain-stack-traces
      - run: test -f example/main.dart
      - run: dart pub publish --dry-run

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/dart
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/dart/rust -> target
          cache-bin: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/cache@v5
        with:
          path: bindings/dart/.dart_tool/hooks_runner
          key: ${{ runner.os }}-dart-hooks-${{ hashFiles('bindings/dart/pubspec.lock', 'bindings/dart/pubspec.yaml', 'bindings/dart/rust/Cargo.lock') }}
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-0.15.0
      - run: dart pub get
      - run: rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown
      - run: command -v wasm-pack >/dev/null || cargo +stable install wasm-pack --version 0.15.0 --locked
      - run: mkdir -p web && dart run maxt:build_web --release
      - run: dart test -p chrome test/web_runtime_test.dart test/custom_adapter_test.dart test/custom_adapter_full_roundtrip_test.dart --chain-stack-traces --timeout=60s --concurrency=1

  native-loader:
    needs: changes
    if: needs.changes.outputs.flutter-packaging == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        working-directory: bindings/dart
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart test test/native_adapters_test.dart --chain-stack-traces

  flutter-build:
    needs: changes
    if: needs.changes.outputs.flutter-packaging == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            command: flutter build apk --debug
          - runner: macos-latest
            command: flutter build ios --simulator --debug --no-codesign
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - shell: bash
        run: |
          flutter create --project-name maxt_smoke "$RUNNER_TEMP/maxt-smoke"
          dart pub add --directory "$RUNNER_TEMP/maxt-smoke" "maxt@{path: $GITHUB_WORKSPACE/bindings/dart}"
          perl -0pi -e \
            "s|import 'package:flutter/material.dart';|import 'package:flutter/material.dart';\nimport 'package:maxt/maxt.dart';|; \
             s|void main\(\) \{|Future<void> main() async {\n  await Maxt.initialize();|" \
            "$RUNNER_TEMP/maxt-smoke/lib/main.dart"
      - working-directory: ${{ runner.temp }}/maxt-smoke
        run: ${{ matrix.command }}
