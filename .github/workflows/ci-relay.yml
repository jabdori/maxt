name: Relay CI

on:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/ci-relay.yml"]
  pull_request:
    paths: ["relay/**", ".github/workflows/ci-relay.yml"]

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: relay
      - run: cargo fmt --manifest-path relay/Cargo.toml --all -- --check
      - run: cargo check --manifest-path relay/Cargo.toml --all-targets --locked
      - run: cargo clippy --manifest-path relay/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path relay/Cargo.toml --all-targets --locked
