[package]
name = "maxt-typescript"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "maxt_typescript"
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
maxt = { version = "=0.3.1", path = "../../.." }
maxt-bindings-common = { version = "=0.3.1", path = "../../common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
napi = { version = "=3.12.0", default-features = false, features = ["napi8", "async", "serde-json"] }
napi-derive = "=3.6.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = "=0.3.33"
js-sys = "=0.3.103"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
