name: Publish Python

on:
  push:
    tags: ["python-v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#python-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' bindings/python/Cargo.toml | head -1)" = "$version"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' bindings/python/pyproject.toml | head -1)" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.10.4"
          python-version: "3.14.2"
          enable-cache: true
          cache-dependency-glob: bindings/python/uv.lock
      - run: cargo run --manifest-path bindings/codegen/Cargo.toml --no-default-features --features python --locked -- python --check
      - working-directory: bindings/python
        run: |
          uv lock --check
          uv sync --frozen --all-groups
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --no-default-features --locked
          uv run --frozen maturin develop --locked
          uv run --frozen pytest
          uv run --frozen mypy python/maxt
        env:
          MAXT_REQUIRE_NATIVE_TESTS: "1"

  wheel:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: "2014"
            platform: manylinux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2014"
            platform: manylinux-aarch64
          - runner: windows-latest
            target: x64
            manylinux: "off"
            platform: windows-x86_64
          - runner: macos-15-intel
            target: x86_64
            manylinux: "off"
            platform: macos-x86_64
          - runner: macos-latest
            target: aarch64
            manylinux: "off"
            platform: macos-aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - uses: PyO3/maturin-action@d60b6a6c53f50a2e78cafc7f8ccb44ed78932dbb
        with:
          working-directory: bindings/python
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist
      - shell: bash
        run: |
          python -m pip install --force-reinstall bindings/python/dist/*.whl
          python -c "import maxt._native"
          python -c "from pathlib import Path; from zipfile import ZipFile; wheel = next(Path('bindings/python/dist').glob('*.whl')); assert 'maxt/examples/binance_public_ticker.py' in ZipFile(wheel).namelist()"
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.platform }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  sdist:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@d60b6a6c53f50a2e78cafc7f8ccb44ed78932dbb
        with:
          command: sdist
          working-directory: bindings/python
          maturin-version: v1.14.1
          args: --out dist
      - run: python -c "from pathlib import Path; import tarfile; source = next(Path('bindings/python/dist').glob('*.tar.gz')); assert any(name.endswith('/python/maxt/examples/binance_public_ticker.py') for name in tarfile.open(source).getnames())"
      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [validate, wheel, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - run: |
          test "$(find dist -name '*.whl' | wc -l)" -eq 5
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 1
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist
          skip-existing: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#python-v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Python $version" \
              --notes "See the [Python changelog]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/bindings/python/CHANGELOG.md)."
