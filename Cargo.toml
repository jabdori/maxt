[package]
name = "maxt"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "One Rust API for Upbit, Bithumb, Binance, and Hyperliquid market data, accounts, and orders."
repository = "https://github.com/jabdori/maxt"
homepage = "https://github.com/jabdori/maxt"
documentation = "https://docs.rs/maxt"
keywords = ["exchange", "trading", "crypto", "websocket", "async"]
categories = ["api-bindings", "asynchronous", "finance"]
readme = "README.md"
exclude = ["/.github", "/docs/superpowers"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
http = "1"
hmac = "0.13"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-str"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.11"
sha3 = "0.12"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lib]
name = "maxt"
path = "src/lib.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
