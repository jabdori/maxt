  freezed_annotation: ^3.1.0
  hooks: ^2.0.2
  native_toolchain_rust: ^1.0.4+0

dev_dependencies:
  build_runner: ^2.15.1
  freezed: ^3.2.5
  lints: ^6.0.0
  test: ^1.26.3
