name: Publish TypeScript

on:
  push:
    tags: ["typescript-v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        working-directory: bindings/typescript
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#typescript-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(node -p 'require("./package.json").version')" = "$version"
          node - <<'JS'
          const pkg = require('./package.json')
          for (const [name, dependency] of Object.entries(pkg.optionalDependencies)) {
            if (dependency !== pkg.version) throw new Error(`${name} must use ${pkg.version}`)
          }
          JS
          echo "version=$version" >> "$GITHUB_OUTPUT"

  native:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64-gnu
            cross: --use-napi-cross
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64-gnu
            cross: --use-napi-cross
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: darwin-x64
            cross: ""
          - runner: macos-latest
            target: aarch64-apple-darwin
            suffix: darwin-arm64
            cross: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: win32-x64-msvc
            cross: ""
    defaults:
      run:
        working-directory: bindings/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json
      - run: npm ci
      - shell: bash
        run: |
          if [[ "${{ matrix.target }}" == aarch64-unknown-linux-gnu ]]; then
            export TARGET_CC=clang TARGET_CXX=clang++
          fi
          npx napi build --manifest-path rust/Cargo.toml --platform --release \
            --target "${{ matrix.target }}" ${{ matrix.cross }} --output-dir . \
            --js native.cjs --dts native.d.ts --js-package-name @jabdori/maxt -- --locked
      - if: startsWith(matrix.suffix, 'linux-')
        shell: bash
        run: |
          maximum="$(readelf --version-info "maxt.${{ matrix.suffix }}.node" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)"
          test "$(printf 'GLIBC_2.17\n%s\n' "$maximum" | sort -V | tail -1)" = GLIBC_2.17
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.suffix }}
          path: bindings/typescript/maxt.${{ matrix.suffix }}.node
          if-no-files-found: error
      - if: matrix.suffix == 'linux-x64-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: native-loader
          path: |
            bindings/typescript/native.cjs
            bindings/typescript/native.d.ts

  package:
    needs: [validate, native]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci
      - run: cargo run --manifest-path ../codegen/Cargo.toml --no-default-features --features typescript --locked -- typescript --check
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: npm run package:dirs
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: bindings/typescript/artifacts/native
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: native-loader
          path: bindings/typescript
      - run: npm run artifacts -- --output-dir artifacts/native --npm-dir npm
      - run: npm run build:browser && npm run build
      - shell: bash
        run: |
          mkdir package-set
          for directory in npm/*; do npm pack "./$directory" --pack-destination package-set --silent; done
          npm pack . --pack-destination package-set --silent
          test "$(find package-set -name '*.tgz' | wc -l)" -eq 6
          tar -tzf "package-set/jabdori-maxt-${{ needs.validate.outputs.version }}.tgz" | grep -Fx package/wasm/maxt_wasm_bg.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: bindings/typescript/package-set/*.tgz
          if-no-files-found: error

  smoke:
    needs: [validate, package]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            suffix: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            suffix: linux-arm64-gnu
          - runner: macos-15-intel
            suffix: darwin-x64
          - runner: macos-latest
            suffix: darwin-arm64
          - runner: windows-latest
            suffix: win32-x64-msvc
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: package-set
      - shell: bash
        run: |
          mkdir "$RUNNER_TEMP/maxt-smoke"
          npm install --prefix "$RUNNER_TEMP/maxt-smoke" \
            "./package-set/jabdori-maxt-${{ matrix.suffix }}-${{ needs.validate.outputs.version }}.tgz" \
            "./package-set/jabdori-maxt-${{ needs.validate.outputs.version }}.tgz"
          cd "$RUNNER_TEMP/maxt-smoke"
          node --input-type=module -e "import('@jabdori/maxt').then(m => { if (!m.Client) process.exit(1) })"

  publish:
    needs: [validate, smoke]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: package-set
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          version="${{ needs.validate.outputs.version }}"
          publish_one() {
            package="$1"
            file="$2"
            if npm view "$package@$version" version --silent >/dev/null 2>&1; then
              echo "$package@$version already exists; skipping."
            else
              npm publish "package-set/$file-$version.tgz" --access public
            fi
          }
          if [[ -z "$NODE_AUTH_TOKEN" ]] && ! npm view '@jabdori/maxt' version --silent >/dev/null 2>&1; then
            echo '::error::The first npm release requires the NPM_TOKEN secret.'
            exit 1
          fi
          publish_one @jabdori/maxt-linux-x64-gnu jabdori-maxt-linux-x64-gnu
          publish_one @jabdori/maxt-linux-arm64-gnu jabdori-maxt-linux-arm64-gnu
          publish_one @jabdori/maxt-darwin-x64 jabdori-maxt-darwin-x64
          publish_one @jabdori/maxt-darwin-arm64 jabdori-maxt-darwin-arm64
          publish_one @jabdori/maxt-win32-x64-msvc jabdori-maxt-win32-x64-msvc
          publish_one @jabdori/maxt jabdori-maxt
