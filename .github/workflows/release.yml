name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      maxt_package_exists: ${{ steps.registry.outputs.maxt_package_exists }}
      common_package_exists: ${{ steps.registry.outputs.common_package_exists }}
      maxt_version_exists: ${{ steps.registry.outputs.maxt_version_exists }}
      common_version_exists: ${{ steps.registry.outputs.common_version_exists }}
      python_package_exists: ${{ steps.registry.outputs.python_package_exists }}
      python_version_exists: ${{ steps.registry.outputs.python_version_exists }}
      dart_package_exists: ${{ steps.registry.outputs.dart_package_exists }}
      dart_version_exists: ${{ steps.registry.outputs.dart_version_exists }}
      npm_bootstrap_needed: ${{ steps.registry.outputs.npm_bootstrap_needed }}
      npm_root_package_exists: ${{ steps.registry.outputs.npm_root_package_exists }}
      npm_root_version_exists: ${{ steps.registry.outputs.npm_root_version_exists }}
      npm_linux_x64_gnu_package_exists: ${{ steps.registry.outputs.npm_linux_x64_gnu_package_exists }}
      npm_linux_x64_gnu_version_exists: ${{ steps.registry.outputs.npm_linux_x64_gnu_version_exists }}
      npm_linux_arm64_gnu_package_exists: ${{ steps.registry.outputs.npm_linux_arm64_gnu_package_exists }}
      npm_linux_arm64_gnu_version_exists: ${{ steps.registry.outputs.npm_linux_arm64_gnu_version_exists }}
      npm_darwin_x64_package_exists: ${{ steps.registry.outputs.npm_darwin_x64_package_exists }}
      npm_darwin_x64_version_exists: ${{ steps.registry.outputs.npm_darwin_x64_version_exists }}
      npm_darwin_arm64_package_exists: ${{ steps.registry.outputs.npm_darwin_arm64_package_exists }}
      npm_darwin_arm64_version_exists: ${{ steps.registry.outputs.npm_darwin_arm64_version_exists }}
      npm_win32_x64_msvc_package_exists: ${{ steps.registry.outputs.npm_win32_x64_msvc_package_exists }}
      npm_win32_x64_msvc_version_exists: ${{ steps.registry.outputs.npm_win32_x64_msvc_version_exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"

      - name: Resolve version and release ref
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual releases must run from main."
              exit 1
            fi
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must use X.Y.Z."
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The release commit must be reachable from main."
            exit 1
          fi

          release_tag="v$version"
          if git rev-parse --verify --quiet "$release_tag^{commit}" >/dev/null; then
            tagged_commit="$(git rev-parse "$release_tag^{commit}")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::$release_tag points to $tagged_commit, not $GITHUB_SHA."
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check manifest versions
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import tomllib

          root = pathlib.Path.cwd()
          expected = os.environ["RELEASE_VERSION"]

          def read_toml(path: str):
              with (root / path).open("rb") as file:
                  return tomllib.load(file)

          manifests = {
              "Cargo.toml": read_toml("Cargo.toml")["package"]["version"],
              "bindings/common/Cargo.toml": read_toml("bindings/common/Cargo.toml")["package"]["version"],
              "bindings/python/Cargo.toml": read_toml("bindings/python/Cargo.toml")["package"]["version"],
              "bindings/python/pyproject.toml": read_toml("bindings/python/pyproject.toml")["project"]["version"],
              "bindings/dart/rust/Cargo.toml": read_toml("bindings/dart/rust/Cargo.toml")["package"]["version"],
          }

          typescript_package = json.loads(
              (root / "bindings/typescript/package.json").read_text()
          )
          typescript_rust = read_toml("bindings/typescript/rust/Cargo.toml")
          manifests.update({
              "bindings/typescript/package.json": typescript_package["version"],
              "bindings/typescript/rust/Cargo.toml": typescript_rust["package"]["version"],
          })

          pubspec = (root / "bindings/dart/pubspec.yaml").read_text()
          match = re.search(r"(?m)^version:\s*([^\s#]+)", pubspec)
          if match is None:
              raise SystemExit("bindings/dart/pubspec.yaml has no top-level version")
          manifests["bindings/dart/pubspec.yaml"] = match.group(1)

          mismatches = {
              path: version
              for path, version in manifests.items()
              if version != expected
          }
          if mismatches:
              raise SystemExit(
                  f"release version {expected} does not match manifests: {mismatches}"
              )

          common = read_toml("bindings/common/Cargo.toml")
          python = read_toml("bindings/python/Cargo.toml")
          dart = read_toml("bindings/dart/rust/Cargo.toml")
          dependencies = {
              "bindings/common -> maxt": common["dependencies"]["maxt"]["version"],
              "bindings/python -> maxt": python["dependencies"]["maxt"]["version"],
              "bindings/python -> maxt-bindings-common": python["dependencies"]["maxt-bindings-common"]["version"],
              "bindings/dart -> maxt": dart["dependencies"]["maxt"],
              "bindings/dart -> maxt-bindings-common": dart["dependencies"]["maxt-bindings-common"],
              "bindings/typescript -> maxt": typescript_rust["dependencies"]["maxt"]["version"].removeprefix("="),
              "bindings/typescript -> maxt-bindings-common": typescript_rust["dependencies"]["maxt-bindings-common"]["version"].removeprefix("="),
          }
          mismatches = {
              dependency: version
              for dependency, version in dependencies.items()
              if version != expected
          }
          if mismatches:
              raise SystemExit(
                  f"release version {expected} does not match dependencies: {mismatches}"
              )

          expected_optional = {
              "@jabdori/maxt-linux-x64-gnu": expected,
              "@jabdori/maxt-linux-arm64-gnu": expected,
              "@jabdori/maxt-darwin-x64": expected,
              "@jabdori/maxt-darwin-arm64": expected,
              "@jabdori/maxt-win32-x64-msvc": expected,
          }
          if typescript_package["optionalDependencies"] != expected_optional:
              raise SystemExit(
                  "TypeScript optionalDependencies must use exact release versions: "
                  f"{typescript_package['optionalDependencies']}"
              )

          if typescript_package["repository"]["url"] != "git+https://github.com/jabdori/maxt.git":
              raise SystemExit("npm provenance requires the jabdori/maxt repository URL")
          PY

      - name: Check registry state
        id: registry
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          check_url() {
            local output="$1"
            local url="$2"
            local response
            response="$(curl --silent --show-error --location \
              --retry 3 --retry-delay 2 \
              --user-agent 'maxt-release-workflow/1.0' \
              --output /dev/null --write-out '%{http_code}' "$url")"
            case "$response" in
              200) echo "$output=true" >> "$GITHUB_OUTPUT" ;;
              404) echo "$output=false" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "::error::Registry check failed for $url with HTTP $response."
                exit 1
                ;;
            esac
          }

          check_url maxt_package_exists \
            "https://crates.io/api/v1/crates/maxt"
          check_url common_package_exists \
            "https://crates.io/api/v1/crates/maxt-bindings-common"
          check_url maxt_version_exists \
            "https://crates.io/api/v1/crates/maxt/$RELEASE_VERSION"
          check_url common_version_exists \
            "https://crates.io/api/v1/crates/maxt-bindings-common/$RELEASE_VERSION"
          check_url python_package_exists \
            "https://pypi.org/pypi/maxt/json"
          check_url python_version_exists \
            "https://pypi.org/pypi/maxt/$RELEASE_VERSION/json"

          pub_response="$(mktemp)"
          pub_status="$(curl --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            --user-agent 'maxt-release-workflow/1.0' \
            --output "$pub_response" --write-out '%{http_code}' \
            https://pub.dev/api/packages/maxt)"
          case "$pub_status" in
            200)
              echo "dart_package_exists=true" >> "$GITHUB_OUTPUT"
              PUB_RESPONSE="$pub_response" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          with open(os.environ["PUB_RESPONSE"]) as file:
              package = json.load(file)
          exists = any(
              release["version"] == os.environ["RELEASE_VERSION"]
              for release in package["versions"]
          )
          print(f"dart_version_exists={str(exists).lower()}")
          PY
              ;;
            404)
              echo "dart_package_exists=false" >> "$GITHUB_OUTPUT"
              echo "dart_version_exists=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Registry check failed for pub.dev with HTTP $pub_status."
              exit 1
              ;;
          esac

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          version = os.environ["RELEASE_VERSION"]
          packages = {
              "root": "@jabdori/maxt",
              "linux_x64_gnu": "@jabdori/maxt-linux-x64-gnu",
              "linux_arm64_gnu": "@jabdori/maxt-linux-arm64-gnu",
              "darwin_x64": "@jabdori/maxt-darwin-x64",
              "darwin_arm64": "@jabdori/maxt-darwin-arm64",
              "win32_x64_msvc": "@jabdori/maxt-win32-x64-msvc",
          }
          states = {}
          for key, package in packages.items():
              url = "https://registry.npmjs.org/" + urllib.parse.quote(package, safe="")
              request = urllib.request.Request(
                  url, headers={"User-Agent": "maxt-release-workflow/1.0"}
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 200:
                          raise SystemExit(
                              f"npm registry returned HTTP {response.status} for {package}"
                          )
                      metadata = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      states[key] = (False, False)
                      continue
                  raise
              states[key] = (True, version in metadata.get("versions", {}))

          print(
              "npm_bootstrap_needed="
              + str(any(not exists for exists, _ in states.values())).lower()
          )
          for key, (exists, version_exists) in states.items():
              print(f"npm_{key}_package_exists={str(exists).lower()}")
              print(f"npm_{key}_version_exists={str(version_exists).lower()}")
          PY

  ci:
    name: Full CI gate
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  npm-native:
    name: npm native (${{ matrix.suffix }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64-gnu
            cross: --use-napi-cross
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64-gnu
            cross: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: darwin-x64
            cross: ""
          - runner: macos-latest
            target: aarch64-apple-darwin
            suffix: darwin-arm64
            cross: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: win32-x64-msvc
            cross: ""
    defaults:
      run:
        working-directory: bindings/typescript
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build native package
        shell: bash
        run: >-
          npx napi build
          --manifest-path rust/Cargo.toml
          --platform
          --release
          --target "${{ matrix.target }}"
          ${{ matrix.cross }}
          --output-dir .
          --js native.cjs
          --dts native.d.ts
          --js-package-name @jabdori/maxt
          -- --locked

      - uses: actions/upload-artifact@v7
        with:
          name: npm-native-${{ matrix.suffix }}
          path: bindings/typescript/maxt.${{ matrix.suffix }}.node
          if-no-files-found: error

      - name: Upload root native loader
        if: matrix.suffix == 'linux-x64-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: npm-loader
          path: |
            bindings/typescript/native.cjs
            bindings/typescript/native.d.ts
          if-no-files-found: error

  python-wheel:
    name: Python wheel (${{ matrix.platform }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
            manylinux: "2014"
            platform: manylinux-x86_64
          - runner: ubuntu-latest
            target: aarch64
            manylinux: "2_28"
            platform: manylinux-aarch64
          - runner: windows-latest
            target: x64
            manylinux: "off"
            platform: windows-x86_64
          - runner: macos-15-intel
            target: x86_64
            manylinux: "off"
            platform: macos-x86_64
          - runner: macos-latest
            target: aarch64
            manylinux: "off"
            platform: macos-aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: bindings/python
          maturin-version: v1.14.1
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.platform }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  python-sdist:
    name: Python source distribution
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          working-directory: bindings/python
          maturin-version: v1.14.1
          args: --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  python-distributions:
    name: Check Python distributions
    needs: [validate, python-wheel, python-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: python-*
          path: dist
          merge-multiple: true

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.10.4"
          enable-cache: true
          cache-dependency-glob: bindings/python/uv.lock

      - name: Check distribution set and metadata
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 5
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          find dist -maxdepth 1 -type f -print0 | while IFS= read -r -d '' file; do
            case "$(basename "$file")" in
              maxt-"$RELEASE_VERSION"-*.whl|maxt-"$RELEASE_VERSION".tar.gz) ;;
              *)
                echo "::error::Unexpected Python distribution: $file"
                exit 1
                ;;
            esac
          done
          uv run --directory bindings/python --frozen twine check "$GITHUB_WORKSPACE"/dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  npm-package:
    name: Assemble npm package set
    needs: [validate, npm-native, python-distributions]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/typescript
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Install WebAssembly build tool
        run: cargo +stable install wasm-pack --version 0.15.0 --locked

      - name: Create platform packages
        run: npm run package:dirs

      - uses: actions/download-artifact@v8
        with:
          pattern: npm-native-*
          path: bindings/typescript/artifacts/native
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: npm-loader
          path: bindings/typescript

      - name: Move native artifacts into platform packages
        run: npm run artifacts -- --output-dir artifacts/native --npm-dir npm

      - name: Build WebAssembly and TypeScript packages
        run: |
          npm run build:browser
          npm run build

      - name: Assemble and verify six tarballs
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for suffix in \
            linux-x64-gnu \
            linux-arm64-gnu \
            darwin-x64 \
            darwin-arm64 \
            win32-x64-msvc
          do
            test -f "npm/$suffix/maxt.$suffix.node"
          done
          test -f native.cjs
          test -f native.d.ts
          test -f wasm/maxt_wasm_bg.wasm

          mkdir package-set
          for directory in npm/*; do
            npm pack "$directory" --pack-destination package-set --silent
          done
          npm pack . --pack-destination package-set --silent

          test "$(find package-set -maxdepth 1 -name '*.tgz' | wc -l)" -eq 6
          root_tarball="package-set/jabdori-maxt-$RELEASE_VERSION.tgz"
          test -f "$root_tarball"
          tar -tzf "$root_tarball" | grep -Fx package/wasm/maxt_wasm_bg.wasm

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package-set
          path: bindings/typescript/package-set/*.tgz
          if-no-files-found: error

  release-artifacts-ready:
    name: All runtime artifacts ready
    needs:
      - ci
      - python-distributions
      - npm-package
    runs-on: ubuntu-latest
    steps:
      - run: echo "Rust, Python, Dart, Node, and browser artifacts passed their release gates."

  rust-publish:
    name: Publish Rust crates
    needs: [validate, release-artifacts-ready]
    if: >-
      needs.validate.outputs.maxt_version_exists != 'true' ||
      needs.validate.outputs.common_version_exists != 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Check crates.io bootstrap token
        id: credentials
        if: >-
          needs.validate.outputs.maxt_package_exists != 'true' ||
          needs.validate.outputs.common_package_exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a token for a first crate release
        if: >-
          steps.credentials.outputs.configured != 'true' &&
          (needs.validate.outputs.maxt_package_exists != 'true' ||
          needs.validate.outputs.common_package_exists != 'true')
        run: |
          echo "::error::The first crates.io release requires the CARGO_REGISTRY_TOKEN secret."
          exit 1

      - name: Authenticate with crates.io
        id: crates-auth
        if: >-
          needs.validate.outputs.maxt_package_exists == 'true' &&
          needs.validate.outputs.common_package_exists == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish maxt
        if: needs.validate.outputs.maxt_version_exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p maxt --registry crates-io --locked

      - name: Wait for maxt registry propagation
        env:
          CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          for _ in {1..30}; do
            if cargo info "maxt@$RELEASE_VERSION" \
              --registry crates-io >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Cargo could not resolve maxt $RELEASE_VERSION from crates.io."
          exit 1

      - name: Publish maxt-bindings-common
        if: needs.validate.outputs.common_version_exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p maxt-bindings-common --registry crates-io --locked

      - name: Wait for maxt-bindings-common registry propagation
        env:
          CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          for _ in {1..30}; do
            if cargo info "maxt-bindings-common@$RELEASE_VERSION" \
              --registry crates-io >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Cargo could not resolve maxt-bindings-common $RELEASE_VERSION from crates.io."
          exit 1

  rust-ready:
    name: Rust release ready
    needs: [validate, ci, release-artifacts-ready, rust-publish]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.ci.result == 'success' &&
      needs.release-artifacts-ready.result == 'success' &&
      (needs.rust-publish.result == 'success' || needs.rust-publish.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Rust crates are available for dependent packages."

  dart-bootstrap-ready:
    name: pub.dev bootstrap ready
    needs: [validate, rust-ready]
    runs-on: ubuntu-latest
    steps:
      - name: Require the first pub.dev package bootstrap
        if: needs.validate.outputs.dart_package_exists != 'true'
        run: |
          echo "::error::Rust crates are available. Now publish bindings/dart 0.1.0 manually to pub.dev, then rerun this release. Python and npm were not published."
          exit 1

  python-publish:
    name: Publish Python package
    needs: [validate, ci, python-distributions, rust-ready, dart-bootstrap-ready]
    if: needs.validate.outputs.python_version_exists != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          skip-existing: true

  npm-publish:
    name: Publish npm packages
    needs: [validate, rust-ready, dart-bootstrap-ready, npm-package]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with Trusted Publishing support
        run: |
          npm install --global npm@11.19.0
          node --version
          npm --version

      - uses: actions/download-artifact@v8
        with:
          name: npm-package-set
          path: package-set

      - name: Prepare ordered idempotent publisher
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/publish-npm.sh" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail

          mode="$1"
          directory="$2"
          version="$3"

          registry_status() {
            local package="$1"
            local encoded="${package/@/%40}"
            encoded="${encoded/\//%2F}"
            curl --silent --show-error --location \
              --retry 3 --retry-delay 2 \
              --user-agent 'maxt-release-workflow/1.0' \
              --output /dev/null --write-out '%{http_code}' \
              "https://registry.npmjs.org/$encoded/$version"
          }

          wait_for_version() {
            local package="$1"
            local status
            for _ in {1..30}; do
              status="$(registry_status "$package")"
              case "$status" in
                200) return ;;
                404) sleep 10 ;;
                *)
                  echo "::error::npm registry returned HTTP $status for $package@$version."
                  exit 1
                  ;;
              esac
            done
            echo "::error::npm did not expose $package@$version after publication."
            exit 1
          }

          publish_one() {
            local package="$1"
            local filename="$2"
            local status
            status="$(registry_status "$package")"
            case "$status" in
              200)
                echo "$package@$version already exists; skipping."
                return
                ;;
              404) ;;
              *)
                echo "::error::npm registry returned HTTP $status for $package@$version."
                exit 1
                ;;
            esac

            args=(publish "$directory/$filename" --access public)
            if [[ "$mode" == bootstrap ]]; then
              args+=(--provenance)
            fi
            npm "${args[@]}"
            wait_for_version "$package"
          }

          publish_one @jabdori/maxt-linux-x64-gnu \
            "jabdori-maxt-linux-x64-gnu-$version.tgz"
          publish_one @jabdori/maxt-linux-arm64-gnu \
            "jabdori-maxt-linux-arm64-gnu-$version.tgz"
          publish_one @jabdori/maxt-darwin-x64 \
            "jabdori-maxt-darwin-x64-$version.tgz"
          publish_one @jabdori/maxt-darwin-arm64 \
            "jabdori-maxt-darwin-arm64-$version.tgz"
          publish_one @jabdori/maxt-win32-x64-msvc \
            "jabdori-maxt-win32-x64-msvc-$version.tgz"
          publish_one @jabdori/maxt "jabdori-maxt-$version.tgz"
          BASH
          chmod +x "$RUNNER_TEMP/publish-npm.sh"

      - name: Require npm token only for package-name bootstrap
        if: needs.validate.outputs.npm_bootstrap_needed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::The first npm release requires the NPM_TOKEN secret."
            exit 1
          fi

      - name: Bootstrap npm package names with token
        if: needs.validate.outputs.npm_bootstrap_needed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          "$RUNNER_TEMP/publish-npm.sh"
          bootstrap
          "$GITHUB_WORKSPACE/package-set"
          "${{ needs.validate.outputs.version }}"

      - name: Publish through npm Trusted Publishing
        if: needs.validate.outputs.npm_bootstrap_needed != 'true'
        run: >-
          "$RUNNER_TEMP/publish-npm.sh"
          trusted
          "$GITHUB_WORKSPACE/package-set"
          "${{ needs.validate.outputs.version }}"

  dart-publish:
    name: Publish Dart and Flutter package
    needs: [validate, ci, rust-ready, dart-bootstrap-ready]
    if: >-
      github.event_name == 'push' &&
      needs.validate.outputs.dart_package_exists == 'true' &&
      needs.validate.outputs.dart_version_exists != 'true'
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
    with:
      working-directory: bindings/dart
      environment: pub.dev

  dart-notice:
    name: Dart publication status
    needs: [validate, ci, rust-ready, dart-publish]
    if: always() && needs.validate.result == 'success' && needs.dart-publish.result == 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped Dart publication
        env:
          EVENT_NAME: ${{ github.event_name }}
          PACKAGE_EXISTS: ${{ needs.validate.outputs.dart_package_exists }}
          VERSION_EXISTS: ${{ needs.validate.outputs.dart_version_exists }}
        shell: bash
        run: |
          if [[ "$VERSION_EXISTS" == "true" ]]; then
            echo "Dart version already exists; publication is idempotently skipped."
          elif [[ "$PACKAGE_EXISTS" != "true" ]]; then
            echo "::notice::The first pub.dev version must be published manually."
          elif [[ "$EVENT_NAME" != "push" ]]; then
            echo "::notice::pub.dev accepts GitHub OIDC publication only from a tag push."
          fi

  release-complete:
    name: Verify lockstep release
    needs:
      - validate
      - dart-bootstrap-ready
      - rust-ready
      - python-publish
      - dart-publish
      - npm-publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful publication jobs
        env:
          BOOTSTRAP_RESULT: ${{ needs.dart-bootstrap-ready.result }}
          RUST_RESULT: ${{ needs.rust-ready.result }}
          PYTHON_RESULT: ${{ needs.python-publish.result }}
          DART_RESULT: ${{ needs.dart-publish.result }}
          NPM_RESULT: ${{ needs.npm-publish.result }}
          DART_PACKAGE_EXISTS: ${{ needs.validate.outputs.dart_package_exists }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DART_PACKAGE_EXISTS" != true ]]; then
            if [[ "$RUST_RESULT" == success ]]; then
              echo "::error::Release blocked after Rust: publish bindings/dart 0.1.0 manually to pub.dev, then rerun."
            else
              echo "::error::Release blocked before the pub.dev bootstrap because Rust is $RUST_RESULT."
            fi
            exit 1
          fi
          test "$BOOTSTRAP_RESULT" = success
          test "$RUST_RESULT" = success
          test "$NPM_RESULT" = success
          [[ "$PYTHON_RESULT" == success || "$PYTHON_RESULT" == skipped ]]
          [[ "$DART_RESULT" == success || "$DART_RESULT" == skipped ]]

      - name: Require two crates, PyPI, pub.dev, and six npm packages
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          version = os.environ["RELEASE_VERSION"]
          npm_packages = [
              "@jabdori/maxt-linux-x64-gnu",
              "@jabdori/maxt-linux-arm64-gnu",
              "@jabdori/maxt-darwin-x64",
              "@jabdori/maxt-darwin-arm64",
              "@jabdori/maxt-win32-x64-msvc",
              "@jabdori/maxt",
          ]

          def fetch_json(url: str):
              request = urllib.request.Request(
                  url, headers={"User-Agent": "maxt-release-workflow/1.0"}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f"HTTP {response.status} for {url}")
                  return json.load(response)

          def missing_versions():
              missing = []
              checks = [
                  (
                      "crate maxt",
                      f"https://crates.io/api/v1/crates/maxt/{version}",
                      lambda payload: payload["version"]["num"] == version,
                  ),
                  (
                      "crate maxt-bindings-common",
                      f"https://crates.io/api/v1/crates/maxt-bindings-common/{version}",
                      lambda payload: payload["version"]["num"] == version,
                  ),
                  (
                      "PyPI maxt",
                      f"https://pypi.org/pypi/maxt/{version}/json",
                      lambda payload: payload["info"]["version"] == version,
                  ),
                  (
                      "pub.dev maxt",
                      "https://pub.dev/api/packages/maxt",
                      lambda payload: any(
                          release["version"] == version
                          for release in payload["versions"]
                      ),
                  ),
              ]
              checks.extend(
                  (
                      f"npm {package}",
                      "https://registry.npmjs.org/"
                      + urllib.parse.quote(package, safe="")
                      + f"/{version}",
                      lambda payload: payload["version"] == version,
                  )
                  for package in npm_packages
              )

              for name, url, matches in checks:
                  try:
                      if not matches(fetch_json(url)):
                          missing.append(name)
                  except urllib.error.HTTPError as error:
                      if error.code == 404:
                          missing.append(name)
                      else:
                          raise
              return missing

          for attempt in range(30):
              missing = missing_versions()
              if not missing:
                  break
              if attempt == 29:
                  raise SystemExit(
                      "release versions did not propagate: " + ", ".join(missing)
                  )
              time.sleep(10)
          PY
