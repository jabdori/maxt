name: Publish Dart

on:
  push:
    tags: ["dart-v*"]

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - shell: bash
        run: |
          version="${GITHUB_REF_NAME#dart-v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(sed -n 's/^version: *//p' bindings/dart/pubspec.yaml | head -1)" = "$version"
      - run: cargo run --manifest-path bindings/codegen/Cargo.toml --no-default-features --features dart --locked -- dart --check
      - working-directory: bindings/dart
        shell: bash
        run: |
          dart pub get
          cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked
          flutter_rust_bridge_codegen generate
          find lib/src/rust -name '*.freezed.dart' -exec perl -pi -e 's/[ \t]+$//' {} +
          perl -pi -e 's/[ \t]+$//' rust/src/frb_generated.rs
          cargo +1.92.0 fmt --manifest-path rust/Cargo.toml
          git diff --exit-code -- lib/src/rust rust/src/frb_generated.rs
          test -z "$(git status --porcelain --untracked-files=all -- lib/src/rust rust/src/frb_generated.rs)"
          dart format --output=none --set-exit-if-changed .
          dart analyze --fatal-warnings
          dart test --chain-stack-traces
      - working-directory: bindings/dart
        shell: bash
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src --target wasm32-unknown-unknown
          rustup toolchain install stable --profile minimal
          cargo +stable install wasm-pack --version 0.15.0 --locked
          mkdir -p web
          dart run maxt:build_web --release
          dart test -p chrome test/web_runtime_test.dart test/custom_adapter_test.dart test/custom_adapter_full_roundtrip_test.dart --chain-stack-traces --timeout=60s --concurrency=1
      - shell: bash
        run: |
          package="$(mktemp -d)"
          cp -R bindings/dart/. "$package/"
          unlink "$package/rust/Cargo.lock"
          unlink "$package/.cargo/config.toml"
          (cd "$package/rust" && cargo check)
          RUSTFLAGS='-C target-feature=+atomics,+bulk-memory,+mutable-globals' \
            cargo +nightly check --manifest-path "$package/rust/Cargo.toml" \
            --target wasm32-unknown-unknown -Z build-std=std,panic_abort

  native-loader:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - shell: bash
        run: |
          cp -R bindings/dart/. "$RUNNER_TEMP/maxt"
          unlink "$RUNNER_TEMP/maxt/rust/Cargo.lock"
          unlink "$RUNNER_TEMP/maxt/.cargo/config.toml"
      - working-directory: ${{ runner.temp }}/maxt
        run: dart pub get
      - working-directory: ${{ runner.temp }}/maxt
        run: dart test test/native_adapters_test.dart --chain-stack-traces

  flutter-build:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            command: flutter build apk --debug
          - runner: macos-latest
            command: flutter build ios --simulator --debug --no-codesign
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - shell: bash
        run: |
          cp -R bindings/dart/. "$RUNNER_TEMP/maxt"
          unlink "$RUNNER_TEMP/maxt/rust/Cargo.lock"
          unlink "$RUNNER_TEMP/maxt/.cargo/config.toml"
          flutter create --project-name maxt_smoke "$RUNNER_TEMP/maxt-smoke"
          dart pub add --directory "$RUNNER_TEMP/maxt-smoke" "maxt@{path: $RUNNER_TEMP/maxt}"
          perl -0pi -e \
            "s|import 'package:flutter/material.dart';|import 'package:flutter/material.dart';\nimport 'package:maxt/maxt.dart';|; \
             s|void main\(\) \{|Future<void> main() async {\n  await Maxt.initialize();|" \
            "$RUNNER_TEMP/maxt-smoke/lib/main.dart"
      - working-directory: ${{ runner.temp }}/maxt-smoke
        run: ${{ matrix.command }}

  publish:
    needs: [validate, native-loader, flutter-build]
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@65eb853c7ba17dde3be364c3d2858773e7144260
    with:
      working-directory: bindings/dart
      environment: pub.dev
    permissions:
      id-token: write
      contents: read

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#dart-v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Dart $version" \
              --notes "See the [Dart changelog]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/bindings/dart/CHANGELOG.md)."
