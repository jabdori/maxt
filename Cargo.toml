[package]
name = "maxt"
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "One Rust API for Upbit, Bithumb, Binance, and Hyperliquid market data, accounts, and orders."
repository = "https://github.com/jabdori/maxt"
homepage = "https://github.com/jabdori/maxt"
documentation = "https://docs.rs/maxt"
keywords = ["exchange", "trading", "crypto", "websocket", "async"]
categories = ["api-bindings", "asynchronous", "finance"]
readme = "README.md"
exclude = ["/.cargo", "/.github", "/bindings", "/docs/superpowers"]

[workspace]
members = ["bindings/common", "bindings/codegen"]
exclude = ["bindings/python", "bindings/dart/rust", "bindings/typescript/rust"]
resolver = "3"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
http = "1"
hmac = "0.13"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
rust_decimal = { version = "1", default-features = false, features = ["std", "serde-str"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "0.11"
sha3 = "0.12"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
reqwest = { version = "0.13", default-features = false }
send_wrapper = { version = "0.6", features = ["futures"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["js", "v4"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1"
web-sys = { version = "0.3", features = ["BinaryType", "Event", "MessageEvent", "WebSocket"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }

[lib]
name = "maxt"
path = "src/lib.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
