name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - examples/**
      - bindings/common/**
      - bindings/codegen/Cargo.toml
      - bindings/codegen/src/main.rs
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - tests/**
      - examples/**
      - bindings/common/**
      - bindings/codegen/Cargo.toml
      - bindings/codegen/src/main.rs
      - .github/workflows/ci.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -p maxt -p maxt-bindings-common -p maxt-bindings-codegen --check
      - run: cargo run -p maxt-bindings-codegen --no-default-features --features rust --locked -- rust --check
      - run: cargo test -p maxt-bindings-common --features codegen --test schema_inventory --locked
      - run: cargo test -p maxt-bindings-common --features codegen --test coverage_inventory --locked
      - run: cargo clippy -p maxt -p maxt-bindings-common --all-targets --locked -- -D warnings
      - run: cargo clippy -p maxt-bindings-codegen --no-default-features --features rust --all-targets --locked -- -D warnings
      - run: cargo clippy -p maxt --lib --locked -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic
      - run: cargo test -p maxt -p maxt-bindings-common --all-targets --no-default-features --locked
      - run: cargo test -p maxt-bindings-codegen --no-default-features --features rust --all-targets --locked
      - run: cargo test -p maxt -p maxt-bindings-common --doc --no-default-features --locked
      - run: cargo build -p maxt --examples --locked
      - run: cargo package -p maxt --locked
